[project]
name = "cover-automation"
version = "0.0.0"
requires-python = ">=3.14.2"
description = "Home Assistant custom integration: cover automation engine"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["custom_components/cover_automation"]
strict = ["custom_components/cover_automation/engine"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
reportMissingImports = true
# HA entity base classes (SwitchEntity.is_on, SelectEntity.current_option/_attr_options, …)
# declare their attrs as cached_property/instance vars purely as a runtime optimization;
# overriding them with plain @property or a class-level default in subclasses is the
# standard, documented HA integration pattern (see e.g. homeassistant/components/*/switch.py)
# and is safe, so this diagnostic — which otherwise flags every such override — is disabled,
# matching Home Assistant core's own pyright configuration.
reportIncompatibleVariableOverride = false
